version: "3.9"

services:
  backend:
    build: .
    container_name: django_app
    entrypoint: /entrypoint.sh
    volumes:
      - .:/app
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    container_name: celery_worker
    entrypoint: /entrypoint_celery.sh
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_DB: NTEC_shop
      POSTGRES_USER: ntec_user
      POSTGRES_PASSWORD: ntec_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: redis_server
    ports:
      - "6379:6379"

volumes:
  postgres_data:
